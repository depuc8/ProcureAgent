[project]
name = "procureagent"
version = "0.1.0"
description = "Multi-agent procurement assistant built on Google ADK and Gemini"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.14,<3",
  "google-cloud-aiplatform[agent_engines,adk]>=1.144",
  "google-cloud-bigquery>=3.25",
  "google-cloud-secret-manager>=2.20",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "pandas>=2.2", "altair>=5"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live: calls real Gemini / GCP; skipped unless PROCURE_RUN_LIVE=1",
]
